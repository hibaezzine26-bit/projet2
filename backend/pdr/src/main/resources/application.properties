spring.application.name=pdr

# Configuration WAMP local (MySQL standard / port 3306 / root sans mot de passe)
spring.datasource.url=jdbc:mysql://localhost:3306/pdr_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Rebuild propre du schéma pour éviter les conflits de contraintes FK sur une base existante partiellement initialisée
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8084